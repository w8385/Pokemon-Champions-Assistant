name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test authority and regression contracts
        run: node --test tests/*.test.mjs

      - name: Verify offline move metadata
        run: node scripts/build-champions-move-meta.mjs --offline --check

      - name: Verify offline item descriptions
        run: python3 scripts/build_item_descriptions.py --check

      - name: Build
        run: npm run build
